<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | LMU Entrepreneurship Society</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <!-- Background Slideshow -->
  <div class="slideshow-container">
    <div class="slide active" style="background-image: url('assets/images/slide1.jpg');">
      <div class="slide-overlay"></div>
    </div>
    <div class="slide" style="background-image: url('assets/images/slide2.jpg');">
      <div class="slide-overlay"></div>
    </div>
  </div>

  <!-- Top Navigation Bar -->
  <nav class="top-nav" id="topNav">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <img src="assets/images/logo-transparent.png" alt="Logo" class="logo-image">
      </a>
      <a href="/" class="nav-title" id="navTitle">
        LMU Entrepreneurship Society
      </a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="hero-content">
      <h1 id="typewriter-title">LMU Entrepreneurship Society</h1>
      <p class="tagline">Empowering Student Entrepreneurs</p>
    </div>
  </main>

  <!-- Action Buttons Section -->
  <section class="action-buttons-section" id="actionButtonsSection">
    <div class="action-buttons-container">
      <a href="#" class="action-button" data-action="join" data-preview="assets/images/slide1.jpg">
        <i class="fas fa-users"></i>Join Our Community
      </a>
      <a href="#" class="action-button" data-action="events" data-preview="assets/images/slide2.jpg">
        <i class="fas fa-calendar"></i>Upcoming Events
      </a>
      <a href="#" class="action-button" data-action="resources" data-preview="assets/images/slide1.jpg">
        <i class="fas fa-book"></i>Startup Resources
      </a>
      <a href="#" class="action-button" data-action="mentorship" data-preview="assets/images/slide2.jpg">
        <i class="fas fa-handshake"></i>Mentorship Program
      </a>
      <a href="#" class="action-button" data-action="stories" data-preview="assets/images/slide1.jpg">
        <i class="fas fa-star"></i>Success Stories
      </a>
      <a href="#" class="action-button" data-action="contact" data-preview="assets/images/slide2.jpg">
        <i class="fas fa-envelope"></i>Contact Us
      </a>
    </div>
    <div class="preview-image-container">
      <div class="preview-image" id="previewImage"></div>
    </div>
  </section>

  <script src="assets/js/slideshow.js"></script>
  <script src="assets/js/menu.js"></script>
</body>
</html>
