      id="subscribeBtn" 
      onclick="handleCalendarSubscribe()"

<script>
function handleCalendarSubscribe() {
  const googleCalendarUrl = 'https://calendar.google.com/calendar/r?cid=7b70d6686889d8da21dd6038fae854cae18698321b76b031f7c5f82fe4f3758e%40group.calendar.google.com';
  const appleCalendarUrl = 'https://calendar.google.com/calendar/ical/7b70d6686889d8da21dd6038fae854cae18698321b76b031f7c5f82fe4f3758e%40group.calendar.google.com/public/basic.ics';
  
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  
  if (isMobile) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    
    if (isIOS) {
      window.open(appleCalendarUrl, '_blank');
    } else {
      window.open(googleCalendarUrl, '_blank');
    }
  } else {
    window.open(googleCalendarUrl, '_blank');
  }
}
</script>
