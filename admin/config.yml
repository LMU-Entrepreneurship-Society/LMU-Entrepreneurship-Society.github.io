backend:
  name: github
  repo: LMU-Entrepreneurship-Society/Website-Source-ES
  branch: main
  base_url: https://lmu-es-cms-auth.lmuentrepreneurshipsociety.workers.dev
  auth_endpoint: auth

# Publish mode - editorial workflow gives you drafts
publish_mode: editorial_workflow

# Media files configuration
media_folder: "assets/images"
public_folder: "/assets/images"

# Collections define the content structure
collections:
  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.yml"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Slideshow Transition Speed (ms)", name: "slideshow_transition_speed", widget: "number", default: 3000, value_type: "int" }
          - label: "Social Links"
            name: "social_links"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Custom Icon Image", name: "icon_image", widget: "image", required: false, hint: "Upload a custom icon (PNG, SVG, or JPG). If not provided, will use Font Awesome icon." }
              - { label: "Icon Type (Font Awesome fallback)", name: "icon", widget: "select", options: ["instagram", "linkedin", "email", "twitter", "facebook", "github", "youtube"], required: false }
              - { label: "Icon Size (pixels)", name: "icon_size", widget: "number", default: 24, value_type: "int", min: 16, max: 64, hint: "Size of the icon in pixels (16-64)" }
          - label: "Action Buttons"
            name: "action_buttons"
            widget: "list"
            fields:
              - { label: "Button Title", name: "title", widget: "string" }
              - { label: "Action ID", name: "action", widget: "string", hint: "Unique identifier for this button (used for functionality)" }
              - { label: "Button URL", name: "url", widget: "string", required: false, hint: "Link destination when button is clicked" }
              - { label: "Button Icon", name: "icon", widget: "select", options: ["users", "calendar", "book", "handshake", "star", "envelope", "home", "info", "heart", "rocket"], required: false, hint: "Font Awesome icon for the button" }
              - { label: "Preview Image", name: "preview_image", widget: "image", required: false, hint: "Image that appears on hover" }

  # Slideshow Images
  - name: "slides"
    label: "Slideshow Images"
    file: "_data/slides.yml"
    fields:
      - label: "Slides"
        name: "slides"
        widget: "list"
        allow_add: true
        fields:
          - { label: "Desktop Image", name: "image", widget: "image" }
          - { label: "Mobile Image", name: "mobile_image", widget: "image", required: false, hint: "Optional mobile-optimized version" }
          - { label: "Alt Text", name: "alt", widget: "string" }
