backend:
  name: github
  repo: LMU-Entrepreneurship-Society/Website-Source-ES
  branch: main
  base_url: https://lmu-es-cms-auth.lmuentrepreneurshipsociety.workers.dev
  auth_endpoint: auth

# Publish mode - editorial workflow gives you drafts
publish_mode: editorial_workflow

# Media files configuration
media_folder: "assets/images"
public_folder: "/assets/images"

# Collections define the content structure
collections:
  # Site Settings
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "_data/settings.yml"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Slideshow Transition Speed (ms)", name: "slideshow_transition_speed", widget: "number", default: 3000, value_type: "int" }
          - label: "Action Buttons"
            name: "action_buttons"
            widget: "list"
            fields:
              - { label: "Button Title", name: "title", widget: "string" }
              - { label: "Action ID", name: "action", widget: "string", hint: "Unique identifier for this button (used for functionality)" }
              - { label: "Button URL", name: "url", widget: "string", required: false, hint: "Link destination when button is clicked" }
              - { label: "Button Icon", name: "icon", widget: "select", options: ["users", "calendar", "book", "handshake", "star", "envelope", "home", "info", "heart", "rocket"], required: false, hint: "Font Awesome icon for the button" }
              - { label: "Preview Image", name: "preview_image", widget: "image", required: false, hint: "Image that appears on hover" }

  # Slideshow Images
  - name: "slides"
    label: "Slideshow Images"
    file: "_data/slides.yml"
    fields:
      - label: "Slides"
        name: "slides"
        widget: "list"
        allow_add: true
        fields:
          - { label: "Desktop Image", name: "image", widget: "image" }
          - { label: "Mobile Image", name: "mobile_image", widget: "image", required: false, hint: "Optional mobile-optimized version" }
          - { label: "Alt Text", name: "alt", widget: "string" }

  # Pages
  - name: "pages"
    label: "Pages"
    files:
      - label: "Calendar Page"
        name: "calendar"
        file: "calendar.html"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "string", default: "Events Calendar" }
          - { label: "Page Content", name: "body", widget: "markdown", hint: "Content that appears below the title" }
      
      - label: "How to Join Page"
        name: "join"
        file: "join.html"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "string", default: "How to Join" }
          - { label: "Page Content", name: "body", widget: "markdown", hint: "Content that appears below the title" }
      
      - label: "About Us Page"
        name: "about"
        file: "about.html"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "string", default: "About Us" }
          - { label: "Mission Statement", name: "mission", widget: "text", hint: "The main mission/purpose statement" }
          - label: "E-Board Members"
            name: "eboard"
            widget: "list"
            allow_add: true
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Position", name: "position", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
          - { label: "Additional Content", name: "body", widget: "markdown", hint: "Any additional content below the e-board section" }
      
      - label: "Newsletter Page"
        name: "newsletter"
        file: "newsletter.html"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Title", name: "title", widget: "string", default: "Newsletter Signup" }
          - { label: "Page Content", name: "body", widget: "markdown", hint: "Content that appears above the signup form" }
